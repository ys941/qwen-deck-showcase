<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B16"/><stop offset="1" stop-color="#121A3A"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#06B6D4"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="card"><rect width="1200" height="130" rx="22"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="130" fill="url(#bg)"/>
  <rect width="1200" height="130" fill="url(#grid)"/>
  <circle cx="1060" cy="65" r="120" fill="#06B6D4" opacity="0.30" filter="url(#blur)"/>
  <rect width="6" height="130" fill="#06B6D4"/>
  <text x="40" y="96" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="#06B6D4" fill-opacity="0.22">02</text>
  <text x="150" y="62" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#F8FAFC">Documents &amp; Training</text>
  <text x="151" y="94" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#67E8F9">Your files, read while it answers. Your chatbots, taught your way</text>
  <path d="M880 65 q 25 -30 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0" fill="none" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 10">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <rect y="126" width="1200" height="4" fill="url(#edge)"/>
</g>
</svg>
