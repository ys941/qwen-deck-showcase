    <circle cx="24" cy="20" r="5" fill="#6366F1">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="83.0" y="26" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">Research</text>
  </g>
  <g transform="translate(442.0,352)">
