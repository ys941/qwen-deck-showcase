    <circle cx="24" cy="20" r="5" fill="#06B6D4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="83.0" y="26" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">Documents</text>
  </g>
  <g transform="translate(608.0,352)">
    <rect width="150" height="40" rx="20" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.55"/>
    <circle cx="24" cy="20" r="5" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.2000000000000002s" repeatCount="indefinite"/>
    </circle>
    <text x="83.0" y="26" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">Interviews</text>
  </g>
  <g transform="translate(774.0,352)">
