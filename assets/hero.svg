    <circle cx="24" cy="20" r="5" fill="#F97316">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="83.0" y="26" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">Meetings</text>
  </g>
  <g transform="translate(940.0,352)">
    <rect width="150" height="40" rx="20" fill="#EC4899" fill-opacity="0.12" stroke="#EC4899" stroke-opacity="0.55"/>
    <circle cx="24" cy="20" r="5" fill="#EC4899">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="2.0s" repeatCount="indefinite"/>
