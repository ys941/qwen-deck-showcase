<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="150" viewBox="0 0 1152 150">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B16"/><stop offset="1" stop-color="#121A3A"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
  <g transform="translate(0,0)">
    <rect width="276" height="150" rx="20" fill="url(#bg)"/>
    <rect width="276" height="150" rx="20" fill="url(#grid)"/>
    <circle cx="236" cy="30" r="70" fill="#8B5CF6" opacity="0.25" filter="url(#blur)"/>
    <text x="28" y="84" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#8B5CF6">12+</text>
    <text x="30" y="122" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#E2E8F0">AI engines to choose from</text>
    <rect x="0.5" y="0.5" width="275" height="149" rx="20" fill="none" stroke="#8B5CF6" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.15;0.6;0.15" dur="3s" begin="0.0s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(292,0)">
    <rect width="276" height="150" rx="20" fill="url(#bg)"/>
    <rect width="276" height="150" rx="20" fill="url(#grid)"/>
    <circle cx="236" cy="30" r="70" fill="#06B6D4" opacity="0.25" filter="url(#blur)"/>
    <text x="28" y="84" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#06B6D4">5</text>
    <text x="30" y="122" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#E2E8F0">assistants in one deck</text>
    <rect x="0.5" y="0.5" width="275" height="149" rx="20" fill="none" stroke="#06B6D4" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.15;0.6;0.15" dur="3s" begin="0.75s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(584,0)">
    <rect width="276" height="150" rx="20" fill="url(#bg)"/>
    <rect width="276" height="150" rx="20" fill="url(#grid)"/>
    <circle cx="236" cy="30" r="70" fill="#22C55E" opacity="0.25" filter="url(#blur)"/>
    <text x="28" y="84" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#22C55E">1</text>
    <text x="30" y="122" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#E2E8F0">click to start everything</text>
    <rect x="0.5" y="0.5" width="275" height="149" rx="20" fill="none" stroke="#22C55E" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.15;0.6;0.15" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(876,0)">
    <rect width="276" height="150" rx="20" fill="url(#bg)"/>
    <rect width="276" height="150" rx="20" fill="url(#grid)"/>
    <circle cx="236" cy="30" r="70" fill="#F97316" opacity="0.25" filter="url(#blur)"/>
    <text x="28" y="84" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#F97316">0</text>
    <text x="30" y="122" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#E2E8F0">risky actions without your OK</text>
    <rect x="0.5" y="0.5" width="275" height="149" rx="20" fill="none" stroke="#F97316" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.15;0.6;0.15" dur="3s" begin="2.25s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
